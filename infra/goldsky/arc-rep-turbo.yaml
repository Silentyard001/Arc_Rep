# infra/goldsky/arc-rep-turbo.yaml
#
# Goldsky TURBO pipeline — Arc Rep historical activity data
#
# PURPOSE
# -------
# Replicates three Arc Mainnet chain-level datasets into the arc_rep schema
# of the developer's Supabase PostgreSQL database. Preserves source schemas
# exactly — all application-level derivations happen in GoldskyActivityProvider.
#
# Target schema:   arc_rep  (pre-migrated and independently verified)
# Primary key:     id
#
# Destination tables:
#   arc_rep.tx_activity       ← arc_mainnet.receipt_transactions v1.1.0
#   arc_rep.erc20_transfers   ← arc_mainnet.erc20_transfers      v1.1.0
#   arc_rep.contract_traces   ← arc_mainnet.raw_traces           v1.1.0
#
# DEPLOYING
# ---------
# Prerequisites:
#   1. goldsky login (one-time browser OAuth)
#   2. arc_rep schema already exists in Supabase (independently verified)
#   3. Goldsky secret POSTGRES_SECRET_CMUGXQ2B80 already registered in this
#      Goldsky project (verified 2026-09-26). Contains the Supabase
#      connection string for the arc_rep schema.
#
# Validate (dry-run — no data flows, no side effects):
#   goldsky turbo validate infra/goldsky/arc-rep-turbo.yaml
#
# Deploy (only after approval):
#   goldsky turbo apply infra/goldsky/arc-rep-turbo.yaml
#
# Monitor:
#   goldsky turbo inspect infra/goldsky/arc-rep-turbo.yaml
#   goldsky turbo inspect infra/goldsky/arc-rep-turbo.yaml -n tx_activity
#   goldsky turbo inspect infra/goldsky/arc-rep-turbo.yaml -n erc20_transfers
#   goldsky turbo inspect infra/goldsky/arc-rep-turbo.yaml -n contract_traces
#
# Stop:
#   goldsky turbo stop arc-rep-historical
#
# DATASET VERSIONS:
#   arc_testnet.receipt_transactions  v1.0.0  (original testnet; superseded)
#   arc_testnet.erc20_transfers       v1.1.0  (original testnet; superseded)
#   arc_testnet.raw_traces            v1.0.0  (original testnet; superseded)
#   arc_mainnet.receipt_transactions  v1.1.0  (active; confirmed 2026-09-26)
#   arc_mainnet.erc20_transfers       v1.1.0  (active; confirmed 2026-09-26)
#   arc_mainnet.raw_traces            v1.1.0  (active; confirmed 2026-09-26)
#   Schema verified column-by-column identical between testnet and mainnet
#   datasets — no sink mapping or DDL changes required for mainnet migration.
#
# TOPICS FORMAT (confirmed from erc20_transfers transformSql):
#   arc_mainnet.raw_logs.topics is comma-delimited.
#   SPLIT_INDEX(topics, ',', 3) IS NULL is used to filter out 4-topic events.
#   Example: "0xddf252ad...,0x000...from,0x000...to" (no trailing comma)
#   This is now moot for the pipeline since arc_mainnet.erc20_transfers is used
#   directly (pre-decoded by Goldsky). GoldskyActivityProvider does not need to
#   parse topics at all. The TOPICS_FORMAT blocker is resolved.
#
# KEY OBSERVATIONS FROM EMPIRICAL DATASET INSPECTION:
#   receipt_transactions.value: Goldsky datatype is `decimal` but the Kafka/
#     sample representation shows binary-encoded bytes for non-zero values (e.g.
#     "\x01cEx]") and empty string ("") for zero values. The Postgres sink will
#     land these as the declared column type in arc_rep.tx_activity. Confirm the
#     actual Postgres column type after first rows arrive. GoldskyActivityProvider
#     must handle both the empty-string-for-zero and binary-encoded cases.
#   erc20_transfers.amount: `decimal` type, arrives as numeric string in samples
#     (e.g. "108682334"). GoldskyActivityProvider uses BigInt(row.amount).
#   raw_traces has `status` (not `receipt_status`) and `trace_id` fields.
#     The destination table arc_rep.contract_traces must match these names.

name: arc-rep-historical
resource_size: m

# ---------------------------------------------------------------------------
# SOURCES
# Three Arc Mainnet datasets. All use start_at: earliest for full historical
# backfill. No filters — wallet-specific queries happen at read time.
# ---------------------------------------------------------------------------

sources:

  arc_transactions:
    type: dataset
    dataset_name: arc_mainnet.receipt_transactions
    version: 1.1.0
    start_at: earliest

  arc_transfers:
    type: dataset
    dataset_name: arc_mainnet.erc20_transfers
    version: 1.1.0
    start_at: earliest

  arc_traces:
    type: dataset
    dataset_name: arc_mainnet.raw_traces
    version: 1.1.0
    start_at: earliest

# ---------------------------------------------------------------------------
# TRANSFORMS
# Minimal pass-throughs that select all source columns explicitly and pass
# _gs_op through for Turbo upsert semantics.
#
# No renames. No derived columns. No filters.
# Schema mirrors the verified Supabase destination tables exactly.
#
# Turbo SQL uses Apache DataFusion (streaming mode).
# No JOINs, no aggregations, no window functions.
# ---------------------------------------------------------------------------

transforms:

  # -------------------------------------------------------------------------
  # Transform 1: receipt_transactions → arc_rep.tx_activity
  #
  # Source columns (v1.1.0, schema identical to testnet v1.0.0 — confirmed):
  #   id, hash, nonce, block_hash, block_number, transaction_index,
  #   from_address, to_address, value, gas, gas_price, input,
  #   max_fee_per_gas, max_priority_fee_per_gas, transaction_type,
  #   block_timestamp, receipt_cumulative_gas_used, receipt_gas_used,
  #   receipt_contract_address, receipt_status, receipt_effective_gas_price,
  #   receipt_root_hash, receipt_l1_fee, receipt_l1_gas_used,
  #   receipt_l1_gas_price, receipt_l1_fee_scalar, receipt_l1_blob_base_fee,
  #   receipt_l1_blob_base_fee_scalar, blob_versioned_hashes,
  #   max_fee_per_blob_gas, receipt_l1_block_number,
  #   receipt_l1_base_fee_scalar, gateway_fee, fee_currency,
  #   gateway_fee_recipient
  # -------------------------------------------------------------------------
  tx_activity:
    type: sql
    primary_key: id
    sql: |
      SELECT
        id,
        hash,
        nonce,
        block_hash,
        block_number,
        transaction_index,
        from_address,
        to_address,
        value,
        gas,
        gas_price,
        input,
        max_fee_per_gas,
        max_priority_fee_per_gas,
        transaction_type,
        block_timestamp,
        receipt_cumulative_gas_used,
        receipt_gas_used,
        receipt_contract_address,
        receipt_status,
        receipt_effective_gas_price,
        receipt_root_hash,
        receipt_l1_fee,
        receipt_l1_gas_used,
        receipt_l1_gas_price,
        receipt_l1_fee_scalar,
        receipt_l1_blob_base_fee,
        receipt_l1_blob_base_fee_scalar,
        blob_versioned_hashes,
        max_fee_per_blob_gas,
        receipt_l1_block_number,
        receipt_l1_base_fee_scalar,
        gateway_fee,
        fee_currency,
        gateway_fee_recipient,
        _gs_op
      FROM arc_transactions

  # -------------------------------------------------------------------------
  # Transform 2: erc20_transfers → arc_rep.erc20_transfers
  #
  # Source columns (v1.1.0, confirmed):
  #   id, address, sender, recipient, amount,
  #   transaction_hash, block_hash, block_number, block_timestamp,
  #   transaction_index, log_index
  #
  # Column `address` is preserved as-is (not renamed to token_address).
  # The destination table arc_rep.erc20_transfers uses `address`.
  # -------------------------------------------------------------------------
  erc20_transfers:
    type: sql
    primary_key: id
    sql: |
      SELECT
        id,
        address,
        sender,
        recipient,
        amount,
        transaction_hash,
        block_hash,
        block_number,
        block_timestamp,
        transaction_index,
        log_index,
        _gs_op
      FROM arc_transfers

  # -------------------------------------------------------------------------
  # Transform 3: raw_traces → arc_rep.contract_traces
  #
  # Source columns (v1.1.0, schema identical to testnet v1.0.0 — confirmed):
  #   id, block_number, block_hash, transaction_hash, transaction_index,
  #   from_address, to_address, value, input, output,
  #   trace_type, call_type, reward_type, gas, gas_used, subtraces,
  #   trace_address, error, status, trace_id, block_timestamp
  # -------------------------------------------------------------------------
  contract_traces:
    type: sql
    primary_key: id
    sql: |
      SELECT
        id,
        block_number,
        block_hash,
        transaction_hash,
        transaction_index,
        from_address,
        to_address,
        value,
        input,
        output,
        trace_type,
        call_type,
        reward_type,
        gas,
        gas_used,
        subtraces,
        trace_address,
        error,
        status,
        trace_id,
        block_timestamp,
        _gs_op
      FROM arc_traces

# ---------------------------------------------------------------------------
# SINKS
# All sinks write to schema arc_rep in Supabase.
# primary_key: id — idempotent upserts, safe on reorgs and restarts.
# batch_size: 1000 — tuned for large historical backfill throughput.
# secret_name: POSTGRES_SECRET_CMUGXQ2B80 — pre-registered Goldsky secret
#   containing the Supabase connection string for arc_rep.
# ---------------------------------------------------------------------------

sinks:

  tx_activity_sink:
    type: postgres
    from: tx_activity
    schema: arc_rep
    table: tx_activity
    secret_name: POSTGRES_SECRET_CMUGXQ2B80
    primary_key: id
    batch_size: 1000

  erc20_transfers_sink:
    type: postgres
    from: erc20_transfers
    schema: arc_rep
    table: erc20_transfers
    secret_name: POSTGRES_SECRET_CMUGXQ2B80
    primary_key: id
    batch_size: 1000

  contract_traces_sink:
    type: postgres
    from: contract_traces
    schema: arc_rep
    table: contract_traces
    secret_name: POSTGRES_SECRET_CMUGXQ2B80
    primary_key: id
    batch_size: 1000
